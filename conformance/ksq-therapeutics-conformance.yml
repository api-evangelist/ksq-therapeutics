domain_standards:
  sector: biotechnology / clinical-stage pharmaceutical
  note: >-
    Reward-only check. The life-sciences domain standards a clinical-stage biotech could plausibly
    declare in a machine-readable contract — HL7 FHIR, CDISC SDTM/ODM, ClinicalTrials.gov PRS,
    ORCID, Crossref/DataCite DOIs, OAI-PMH — are absent, and correctly so: this contract describes a
    WordPress marketing site, not a clinical, research-data or publication surface. KSQ registers its
    trials with ClinicalTrials.gov and publishes posters and papers, but exposes neither through an
    API of its own. No domain standard is asserted, and none is invented to fill the slot.
