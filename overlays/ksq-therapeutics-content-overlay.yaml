overlay: 1.0.0
info:
  title: KSQ Therapeutics Content API — API Evangelist enhancements
  version: 1.0.0
  x-generated: '2026-08-23'
  x-method: generated
  x-source: >-
    Generated by the API Evangelist enrichment pipeline on 2026-08-23. Extends
    openapi/_original/ksq-therapeutics-content-openapi.yml, which is itself derived from the live
    WordPress REST route index at https://ksqtx.com/wp-json/. The original is never mutated.
  x-note: >-
    KSQ Therapeutics publishes no OpenAPI, so there is no vendor document to overlay in the usual
    sense. What this overlay records is the layer API Evangelist added on top of the machine-readable
    route index the site serves: external documentation links, the observed rate-limit posture, the
    read-only reversibility finding, and cross-references to the derived artifacts in this repo.
extends: ../openapi/_original/ksq-therapeutics-content-openapi.yml
actions:
- target: $.info
  description: Attach external documentation and the artifact cross-reference set.
  update:
    x-api-evangelist-artifacts:
      authentication: authentication/ksq-therapeutics-authentication.yml
      conventions: conventions/ksq-therapeutics-conventions.yml
      errors: errors/ksq-therapeutics-problem-types.yml
      lifecycle: lifecycle/ksq-therapeutics-lifecycle.yml
      data_model: data-model/ksq-therapeutics-data-model.yml
      conformance: conformance/ksq-therapeutics-conformance.yml
      rate_limits: rate-limits/ksq-therapeutics-rate-limits.yml
      well_known: well-known/ksq-therapeutics-well-known.yml
      skills: skills/_index.yml
- target: $
  description: Add the upstream contract definition as externalDocs, since the provider publishes none.
  update:
    externalDocs:
      description: >-
        WordPress REST API Handbook — the upstream specification that defines the wp/v2 contract
        this deployment serves. KSQ Therapeutics publishes no reference of its own.
      url: https://developer.wordpress.org/rest-api/
- target: $.info
  description: Record the observed runtime posture that the route index does not express.
  update:
    x-runtime-posture:
      read_only_anonymously: true
      write_surface_requires: WordPress Application Password (HTTP Basic)
      reversibility: na
      idempotency: na
      dry_run: na
      rate_limit_documented: false
      rate_limit_enforced: true
      rate_limit_signal: >-
        HTTP 403 with an HTML "WP Remote Firewall / Blocked because of Malicious Activities" body,
        no Retry-After and no RateLimit headers. Observed 2026-08-23.
- target: $.servers[0]
  description: Note that the base URL is the corporate marketing site, not a product API host.
  update:
    x-host-class: cms
    x-host-note: >-
      ksqtx.com is the corporate WordPress site. No api., docs. or developer. subdomain serves a
      certificate; the domain uses wildcard DNS to a GoDaddy parking address.
- target: $.paths['/wp/v2/press_release'].get
  description: Flag the highest-value collection on this deployment for agent consumers.
  update:
    x-agent-priority: high
    x-agent-note: >-
      The 39-item press-release archive is the substantive KSQ content available over REST. The
      pipeline, platform, leadership, board and investor pages are HTML-only.
- target: $.paths['/wp/v2/search'].get
  description: Mark search as the recommended entry point.
  update:
    x-agent-priority: high
    x-agent-note: >-
      Returns 48 records spanning every REST-exposed type. Cheapest first call for an agent that
      does not know which collection holds what it wants.
