reversibility:
  status: na
  grade: na
  note: >-
    Every operation catalogued in openapi/ is a GET. There is no write surface reachable without
    credentials, so there is no action an agent could take that would need taking back, and
    reversibility, dry-run and idempotency are all honestly na rather than zero. The administrative
    write surface (POST/PUT/PATCH/DELETE on /wp/v2/*) is WordPress core: it offers no reversal
    operation, no undo endpoint and no restore window, except for the standard WordPress trash
    behaviour on posts and pages, where DELETE without force=true moves an item to status "trash"
    and it can be restored by setting status back to a published state. KSQ documents no window for
    that and none is asserted here.
  write_surface_reachable_anonymously: false
