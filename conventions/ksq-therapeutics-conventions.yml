idempotency:
  supported: false
  header: null
  note: >-
    The catalogued surface is read-only, so there is nothing to make idempotent. GET is already
    safe and idempotent by HTTP semantics. WordPress core provides no idempotency-key mechanism for
    its write operations either, and those writes are administrative and credential-gated. NO
