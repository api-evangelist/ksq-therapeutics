aid: ksq-therapeutics
name: KSQ Therapeutics
description: >-
  KSQ Therapeutics is a clinical-stage biotechnology company headquartered at 4 Maguire Road in
  Lexington, Massachusetts, founded in 2015 by pioneers of CRISPR screening and functional genomics.
  Its proprietary CRISPRomics platform runs genome-scale CRISPR/Cas9 functional genomic screens across
  cancer models and immune cell types to identify therapeutic targets that directly correlate genomic
  function to disease. The company applies those targets in two directions: CRISPR/Cas9-engineered
  tumor-infiltrating lymphocyte (eTIL) cell therapies, where a single gene is inactivated to increase
  the tumor-killing capacity of a patient's own T cells — KSQ-001EX (SOCS1 inactivated) and KSQ-004EX
  (SOCS1 and Regnase-1 inactivated) — and small molecules such as KSQ-4279, a first-in-class USP1
  inhibitor for advanced solid tumors. KSQ has run broad discovery collaborations with Takeda, licensed
  cell-therapy technology with CRISPR Therapeutics, partnered manufacturing with CTMC, and sold multiple
  research-stage oncology programs to Ono Pharmaceutical. Investors include Flagship Pioneering, ARCH
  Venture Partners, Polaris Partners, Alexandria, Alpha Wave Global, Baillie Gifford, Invus, LG and
  Lilly Asia Ventures. KSQ Therapeutics runs no developer program and publishes no product API,
  developer portal, OpenAPI or API reference. The only machine-readable surfaces reachable without
  credentials are the WordPress REST content API behind ksqtx.com, an All in One SEO generated
  /llms.txt, and the open-source bioinformatics code in its public GitHub organization — all
  catalogued here.
