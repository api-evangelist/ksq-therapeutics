recommendation: >-
  If KSQ wants this content readable by agents and aggregators — and the site already ships an
  /llms.txt inviting exactly that — the firewall should return 429 with a Retry-After header and the
  JSON error envelope, so a well-behaved client can back off instead of being told it is malicious.
