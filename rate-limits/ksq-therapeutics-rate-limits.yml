note: >-
  KSQ Therapeutics documents no rate limits — it publishes no developer documentation at all. The
  surface nevertheless enforces one, undocumented and unsignalled, and that was observed directly
  during this pass. After roughly forty anonymous GETs across /wp-json/ within a few minutes, the
  origin began returning HTTP 403 with an HTML body reading "WP Remote Firewall / Blocked because of
  Malicious Activities" and a per-block Reference ID. No RateLimit-*, X-RateLimit-* or Retry-After
  header accompanied the block, the status code is 403 rather than 429, and the body is HTML rather
  than the WordPress JSON error envelope — so a client has no machine-readable way to distinguish
  throttling from authorization failure, and no way to know how long to wait. That is the finding.
